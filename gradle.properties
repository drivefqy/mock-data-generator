# ---- 通用构建配置(随仓库分发) ----
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.stdlib.default.dependency=true

# ---- 本机相关配置 ----
# datagripHome 与 JDK 路径因机器而异,不要写进仓库。
# 放到用户级配置 ~/.gradle/gradle.properties(天然不入库),或用 -P 传入:
#   gradle buildPlugin -PdatagripHome="C:/Program Files/JetBrains/DataGrip 2026.2"
#
# datagripHome=/path/to/DataGrip
# org.gradle.java.installations.paths=/path/to/jdk21
